name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            requirements/vision-cpu.txt
            requirements/vision-identity.txt
            SDA-GCN/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/vision-cpu.txt
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -r requirements/vision-identity.txt
          python -m pip install -e ./SDA-GCN

      - name: Lint with ruff
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key