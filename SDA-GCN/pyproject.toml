[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sda-vision"
version = "0.1.0"
description = "Reusable SDA-GCN pose, fall-detection, and identity runtime"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["sda_vision*", "model*", "graph*", "fusion*", "feeders*", "extractkpt*"]

