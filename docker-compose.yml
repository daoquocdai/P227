services:
  # 1. TRẠM TRUNG CHUYỂN MQTT
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: guardiancam_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # 2. BACKEND API & AI AGENT
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardiancam_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots  # Mount thêm thư mục ảnh vào container
    depends_on:
      - mqtt-broker                 # Đảm bảo MQTT khởi động trước Backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3