target-version = "py311"
line-length = 120

# Only lint maintained GuardianCam application/runtime code.
# SDA-GCN research, training, experiments, datasets, and model workspace
# are intentionally outside the application Ruff quality gate.
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "SDA-GCN/sda_vision/**/*.py",
]

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/test_api/test_camera_vision.py" = ["N802"]
"tests/test_services/test_camera_runtime.py" = ["N802"]
"tests/test_services/test_vision_manager.py" = ["N802"]

[format]
quote-style = "double"
indent-style = "space"